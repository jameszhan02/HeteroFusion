experiment_name: gsm8k_heterofusion_64
output_dir: /data/adapters/8_to_1_r64

# The fused adapter is exported for this target base model.
# Replace with the base model that owns initial_target_lora.
base_model_path: /data/shared_ckpt/Llama-3.2-1B

# Target anchor LoRA. Its adapter basis is preserved by the default b_only mode.
initial_target_lora: /data/shared_ckpt/Llama-3.2-1B-Instruct_r64

data_global:
  dataset_dir: data
  template: llama3
  cutoff_len: 1024
  batch_size: 1
  num_workers: 4

tasks:
  - task_name: r128_fusion
    # Put the other heterogeneous LoRA checkpoint here. Add more paths if needed.
    source_lora_paths:
      - "/data/shared_ckpt/opd_teacher_r64"
    transfer_ratio: "1"
    layer_alignment: tail
    datasets:
      # Replace this with replay data that matches your target/source tasks.
      # Dataset names must exist in data/dataset_info.json or data/sample/dataset_info.json.
      - name: gsm8k_fusion_train_200
        type: main
    training:
      fusion_group_name: custom_two_ckpt_transfer
      # LoRA block row#
      block_size: 256
      embed_dim: 512
      num_heads: 8
      max_position_embeddings: 4096
      num_epochs: 3
      lr: 5.0e-05
      alpha_init: 0.3
      gradient_accumulation_steps: 8
      mu_gate: 0.1
      lambda_reg: 0.005
      mu_target: 0.0
      sigma_target: 1.0
      num_projections: 2048
      update_mode: b_only
      seed: 42
