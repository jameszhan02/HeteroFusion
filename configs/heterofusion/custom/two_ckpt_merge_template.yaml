experiment_name: heterofusion_sanity_check
output_dir: /data/shared_ckpt/opd_teacher_sanity_check

# The fused adapter is exported for this target base model.
# Replace with the base model that owns initial_target_lora.
base_model_path: /data/shared_ckpt/opd_teacher

# Target anchor LoRA. Its adapter basis is preserved by the default b_only mode.
initial_target_lora: /data/shared_ckpt/opd_teacher_r64

data_global:
  dataset_dir: data
  template: alpaca
  cutoff_len: 1024
  batch_size: 1
  num_workers: 4

tasks:
  - task_name: heterofusion_sanity_check
    # Put the other heterogeneous LoRA checkpoint here. Add more paths if needed.
    source_lora_paths:
      - "/data/shared_ckpt/opd_teacher_r64"
      #  - "/data/shared_ckpt/Qwen/Qwen2.5-1.5B-random-nomatch-lora"
      # - "/data/shared_ckpt/Qwen/Qwen2_5-1_5B-using-openai-gsm8k-data-enhanced-with-deepseek-v1-r8"
    transfer_ratio: "1"
    layer_alignment: tail
    datasets:
      # Replace this with replay data that matches your target/source tasks.
      # Dataset names must exist in data/dataset_info.json or data/sample/dataset_info.json.
      # Same 200 GSM8K examples as the historical replay set, but the inner
      # instruction and supervised response match the R1-zero eval contract.
      - name: gsm8k_fusion_train_200_r1_zero
        type: main
    training:
      fusion_group_name: custom_two_ckpt_transfer
      # LoRA block row#
      block_size: 512
      embed_dim: 1024
      num_heads: 8
      max_position_embeddings: 4096
      num_epochs: 3
      lr: 5.0e-05
      alpha_init: 0.3
      gradient_accumulation_steps: 8
      mu_gate: 0.1
      lambda_reg: 0.005
      mu_target: 0.0
      sigma_target: 1.0
      num_projections: 2048
      update_mode: b_only
      seed: 42
