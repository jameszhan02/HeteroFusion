experiment_name: r64_target_personality-detection
output_dir: /data/shared_ckpt/qwen_to_3_r64

# The fused adapter is exported for this target base model.
# Replace with the base model that owns initial_target_lora.
base_model_path: /data/shared_ckpt/llama32-1b-loosepacked_4ep_20260807_233449/hf_ckpts/step_0002400

# Target anchor LoRA. Its adapter basis is preserved by the default b_only mode.
initial_target_lora: /data/shared_ckpt/llama-3.2-1B-personality-detection-C

data_global:
  dataset_dir: data
  template: alpaca
  cutoff_len: 1024
  batch_size: 1
  num_workers: 4

tasks:
  - task_name: r64_target_personality-detection
    # Put the other heterogeneous LoRA checkpoint here. Add more paths if needed.
    source_lora_paths:
      - "/data/shared_ckpt/Qwen/Qwen2.5-1.5B-random-nomatch-lora"
      #  - "/data/shared_ckpt/Qwen/Qwen2.5-1.5B-random-nomatch-lora"
      # - "/data/shared_ckpt/Qwen/grpo-baseline-qwen2.5-1.5b-lora"
    transfer_ratio: "1"
    layer_alignment: tail
    datasets:
      # Replace this with replay data that matches your target/source tasks.
      # Dataset names must exist in data/dataset_info.json or data/sample/dataset_info.json.
      - name: gsm8k_fusion_train_200
        type: main
    training:
      fusion_group_name: custom_two_ckpt_transfer
      # LoRA block row#
      block_size: 512
      embed_dim: 1024
      num_heads: 8
      max_position_embeddings: 4096
      num_epochs: 3
      lr: 5.0e-05
      alpha_init: 0.3
      gradient_accumulation_steps: 8
      mu_gate: 0.1
      lambda_reg: 0.005
      mu_target: 0.0
      sigma_target: 1.0
      num_projections: 2048
      update_mode: b_only
      seed: 42
